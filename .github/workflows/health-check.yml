name: Guizzprints health check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guizzprints-health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production liveness endpoint
        env:
          HEALTH_URL: https://guizzprints.xyz/api/health
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --location \
            --retry 2 --retry-delay 5 --max-time 20 "$HEALTH_URL")"
          echo "$response"
          test "$(printf '%s' "$response" | jq -r '.ok')" = "true"
