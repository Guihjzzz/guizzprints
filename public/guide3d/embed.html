<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guia 3D Guizzprints</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050608;color:#fff;font-family:Inter,system-ui,sans-serif}
    #viewer{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050608}
    .badge{position:absolute;left:14px;top:14px;z-index:3;display:flex;align-items:center;gap:8px;border:1px solid rgba(239,68,68,.32);border-radius:999px;background:rgba(5,6,8,.82);padding:8px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(10px);pointer-events:none}
    .dot{width:7px;height:7px;border-radius:50%;background:#ef4444;box-shadow:0 0 12px #ef4444}
    .hint{position:absolute;right:14px;top:14px;z-index:3;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(5,6,8,.78);padding:8px 11px;color:#a1a1aa;font-size:11px;backdrop-filter:blur(10px);pointer-events:none}
    @media(max-width:640px){.hint{display:none}.badge{left:8px;top:8px;padding:7px 10px}}
  </style>
</head>
<body>
  <iframe id="viewer" title="Amostra interativa do Guia 3D" src="./engine/viewer.html?guizz=1&amp;catalog=1&amp;embed=1" allow="fullscreen"></iframe>
  <div class="badge"><span class="dot"></span><span id="status">Preparando Guia 3D</span></div>
  <div class="hint">Arraste para girar · role para zoom · use a barra para mudar as camadas</div>
  <script>
    (() => {
      const frame = document.querySelector('#viewer');
      const status = document.querySelector('#status');
      const params = new URLSearchParams(location.search);
      const requested = params.get('model') || '/demo/warden/warden.schem';
      const model = requested.startsWith('/') && !requested.startsWith('//') ? requested : '/demo/warden/warden.schem';
      const title = (params.get('title') || 'Construção Guizzprints').slice(0, 100);
      const send = (cmd, payload = {}) => frame.contentWindow?.postMessage({ bi: 1, cmd, ...payload }, location.origin);

      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          const style = doc.createElement('style');
          style.textContent = '#biPanelTab,#biPanel,#biFs,#biSnd,.biTouchHint,.biRemoteBtn{display:none!important}';
          doc.head.appendChild(style);
        } catch (_) {}
      });

      addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
        const data = event.data;
        if (!data || data.bi !== 1) return;
        if (data.cmd === 'ready') {
          status.textContent = 'Carregando construção';
          send('auth', { member: true });
          send('gate', { on: false });
          send('studioPanel', { open: false });
          send('bg', { mode: 'dark' });
          send('loadSchem', { url: model, name: model.split('/').pop(), title });
        }
        if (data.cmd === 'buildLoaded' && data.painted) {
          status.textContent = 'Zoom e camadas ativos';
          const steps = Number(data.steps || 0);
          if (steps > 0) send('rgoto', { n: steps });
          setTimeout(() => {
            send('relayout');
            send('thumbAim', { rot: 45, el: 35.264, zoom: 1, shadow: .22, ao: true });
          }, 180);
        }
        if (data.cmd === 'buildFailed') status.textContent = 'Falha ao abrir a amostra';
      });
    })();
  </script>
</body>
</html>
