<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador Guizz Studio</title>
  <style>html,body,#engine{width:100%;height:100%;margin:0;border:0;background:#050608}#engine{display:block}</style>
</head>
<body>
  <iframe id="engine" title="Motor local do Guizz Studio" src="./engine/viewer.html?guizz=1&amp;publisher=1" allow="fullscreen"></iframe>
  <script type="module">
    import { convertFileToSchem } from './studio/converter/formatBridge.js?v=studio-publisher-2';

    const engine = document.querySelector('#engine');
    const origin = location.origin;
    let engineReady = false;
    let pendingLoad = null;
    let activeUrl = '';
    let publicationTitle = 'Construção Guizzprints';
    let generationQueue = [];

    const emit = (type, payload = {}, transfer = []) => {
      if (window.parent === window) return;
      window.parent.postMessage({ guizzPublisher: 1, type, ...payload }, origin, transfer);
    };
    const send = (cmd, payload = {}) => engine.contentWindow?.postMessage({ bi: 1, cmd, ...payload }, origin);

    const loadImage = (url) => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Uma imagem gerada não pôde ser lida.'));
      image.src = url;
    });

    const canvasBlob = (canvas) => new Promise((resolve, reject) => {
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('O navegador não conseguiu criar o PNG.')), 'image/png');
    });

    async function composeProductSheet(shots, { columns, title, width, height, kind }) {
      if (!Array.isArray(shots) || shots.length < 1) throw new Error('O Guizz Studio não recebeu as imagens necessárias.');
      const images = await Promise.all(shots.map((shot) => loadImage(shot?.url)));
      const rows = Math.ceil(images.length / columns);
      const header = kind === 'board' ? 150 : 0;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d', { alpha: false });
      if (!context) throw new Error('Canvas 2D indisponível.');

      context.fillStyle = '#f6f7f8';
      context.fillRect(0, 0, width, height);
      if (header) {
        context.fillStyle = '#111827';
        context.font = '700 44px system-ui, sans-serif';
        context.fillText(title, 54, 68);
        context.fillStyle = '#2563eb';
        context.font = '700 26px system-ui, sans-serif';
        context.fillText('www.guizzprints.xyz', 54, 112);
      }

      const cellWidth = width / columns;
      const cellHeight = (height - header) / rows;
      images.forEach((image, index) => {
        const column = index % columns;
        const row = Math.floor(index / columns);
        const x = column * cellWidth;
        const y = header + row * cellHeight;
        context.fillStyle = index % 2 ? '#ffffff' : '#eef2f7';
        context.fillRect(x, y, cellWidth, cellHeight);
        context.strokeStyle = '#d6dce6';
        context.lineWidth = 2;
        context.strokeRect(x + 1, y + 1, cellWidth - 2, cellHeight - 2);
        const padding = kind === 'board' ? 28 : 20;
        const scale = Math.min((cellWidth - padding * 2) / image.width, (cellHeight - padding * 2) / image.height);
        const drawWidth = image.width * scale;
        const drawHeight = image.height * scale;
        context.drawImage(image, x + (cellWidth - drawWidth) / 2, y + (cellHeight - drawHeight) / 2, drawWidth, drawHeight);
      });

      if (!header) {
        context.fillStyle = 'rgba(37,99,235,.75)';
        context.font = '700 25px system-ui, sans-serif';
        context.textAlign = 'center';
        context.fillText('www.guizzprints.xyz', width / 2, height / 2 + 8);
        context.textAlign = 'start';
      }
      return canvasBlob(canvas);
    }

    async function loadBuild(payload) {
      try {
        emit('status', { message: 'Guizz Studio preparando a construção…' });
        const file = new File([payload.buffer], payload.name || 'construcao.mcstructure', { type: 'application/octet-stream' });
        const result = await convertFileToSchem(file);
        const schemBuffer = await result.file.arrayBuffer();
        if (activeUrl) URL.revokeObjectURL(activeUrl);
        activeUrl = URL.createObjectURL(new Blob([schemBuffer], { type: 'application/octet-stream' }));
        publicationTitle = String(payload.title || result.file.name).slice(0, 100);
        emit('status', { message: 'Guizz Studio montando a capa e a prancha…' });
        send('loadSchem', { url: activeUrl, name: result.file.name, title: publicationTitle });
      } catch (error) {
        emit('error', { message: error instanceof Error ? error.message : 'Não foi possível abrir a construção no Guizz Studio.' });
      }
    }

    function nextGeneration() {
      const next = generationQueue.shift();
      if (!next) return emit('generated');
      if (next === 'cover') {
        emit('status', { message: 'Guizz Studio criando a capa com quatro vistas…' });
        send('shots', { n: 4, size: 1200 });
      } else if (next === 'board') {
        emit('status', { message: 'Guizz Studio criando a prancha completa…' });
        send('shots', { n: 8, size: 1200 });
      }
    }

    addEventListener('message', (event) => {
      if (event.origin !== origin || event.source !== window.parent) return;
      const data = event.data;
      if (!data || data.guizzPublisher !== 1) return;
      if (data.type === 'load' && data.buffer) {
        if (!engineReady) pendingLoad = data;
        else void loadBuild(data);
      }
      if (data.type === 'generateStudio' && engineReady) {
        publicationTitle = String(data.title || publicationTitle).slice(0, 100);
        generationQueue = ['cover', 'board'];
        nextGeneration();
      }
    });

    addEventListener('message', (event) => {
      if (event.origin !== origin || event.source !== engine.contentWindow) return;
      const data = event.data;
      if (!data || data.bi !== 1) return;
      if (data.cmd === 'ready') {
        engineReady = true;
        send('auth', { member: true });
        send('gate', { on: false });
        send('bg', { mode: 'dark' });
        send('setGrid', { hidden: true });
        emit('ready');
        if (pendingLoad) {
          const payload = pendingLoad;
          pendingLoad = null;
          void loadBuild(payload);
        }
      }
      if (data.cmd === 'buildLoaded' && data.painted) {
        emit('loaded', { blocks: Number(data.blocks || 0), steps: Number(data.steps || 0), dims: data.dims || null });
        send('rgoto', { n: Number(data.steps || 0) });
        send('fitBuild', { rot: 45, elevation: 28 });
      }
      if (data.cmd === 'buildFailed') emit('error', { message: data.error || 'O Guizz Studio não conseguiu abrir a construção.' });
      if (data.cmd === 'shotsDone') {
        const task = generationQueue.length === 1 ? 'cover' : 'board';
        const options = task === 'cover'
          ? { columns: 2, title: publicationTitle, width: 1600, height: 1600, kind: 'cover' }
          : { columns: 4, title: publicationTitle, width: 2000, height: 1150, kind: 'board' };
        void composeProductSheet(data.shots, options)
          .then(async (blob) => {
            const buffer = await blob.arrayBuffer();
            emit(task, { buffer, mime: 'image/png' }, [buffer]);
            nextGeneration();
          })
          .catch((error) => emit('error', { message: error?.message || 'Falha ao criar as imagens do Guizz Studio.' }));
      }
    });
  </script>
</body>
</html>
