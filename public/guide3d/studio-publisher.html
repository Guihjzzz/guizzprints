<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerador Guizz Studio</title>
  <style>html,body,#engine{width:100%;height:100%;margin:0;border:0;background:#09090b}</style>
</head>
<body>
  <!-- The native Studio stays isolated here. The parent only receives its final PNG. -->
  <iframe id="engine" title="Guizz Studio original" src="/guide3d/studio-original/viewer.html" allow="fullscreen"></iframe>
  <script>
    (() => {
      const PUBLISHER_EVENT = 'guizzPublisher';
      const NATIVE_EVENT = 'guizzNativeStudio';
      const EXTERNAL_EVENT = 'guizzStudioPublisher';
      const engine = document.querySelector('#engine');
      const sameOrigin = window.location.origin;
      const engineOrigin = new URL(engine.src, window.location.href).origin;
      let engineEvent = '';
      let boardDelivered = false;
      const readyTimer = window.setTimeout(() => {
        emit('error', { message: 'O Guizz Studio original não respondeu. Recarregue a página e tente novamente.' });
      }, 20_000);

      const emit = (type, payload = {}, transfer = []) => {
        if (window.parent === window) return;
        window.parent.postMessage({ [PUBLISHER_EVENT]: 1, type, ...payload }, sameOrigin, transfer);
      };

      const forwardToNative = (type, payload = {}, transfer = []) => {
        if (!engineEvent) return;
        const external = engineEvent === EXTERNAL_EVENT;
        engine.contentWindow?.postMessage({
          [engineEvent]: 1,
          type: external && type === 'generateBoard' ? 'generate' : type,
          ...(external && type === 'generateBoard' ? { includeViews: false } : {}),
          ...payload,
        }, engineOrigin, transfer);
      };

      window.addEventListener('message', (event) => {
        const fromParent = event.source === window.parent && event.origin === sameOrigin;
        const fromEngine = event.source === engine.contentWindow && event.origin === engineOrigin;
        if (!fromParent && !fromEngine) return;
        const data = event.data || {};

        if (fromParent && data[PUBLISHER_EVENT] === 1) {
          if (data.type === 'load') {
            boardDelivered = false;
            forwardToNative('load', {
              loadId: String(data.loadId || Date.now()),
              name: data.name,
              title: data.title,
              buffer: data.buffer,
            }, data.buffer instanceof ArrayBuffer ? [data.buffer] : []);
          }
          if (data.type === 'generateStudio') forwardToNative('generateBoard', { title: data.title });
          return;
        }

        if (!fromEngine) return;
        const eventName = data[NATIVE_EVENT] === 1 ? NATIVE_EVENT : data[EXTERNAL_EVENT] === 1 ? EXTERNAL_EVENT : '';
        if (!eventName) return;
        engineEvent = eventName;
        if (data.type === 'ready' || data.type === 'studio-ready') {
          window.clearTimeout(readyTimer);
          emit('ready');
        }
        if (data.type === 'status') emit('status', { message: data.message });
        if (data.type === 'loaded') emit('loaded', { dims: data.dimensions || data.dims || null });
        if (data.type === 'board' && data.buffer instanceof ArrayBuffer) {
          emit('board', { buffer: data.buffer, mime: data.mime || 'image/png' }, [data.buffer]);
          if (!boardDelivered) {
            boardDelivered = true;
            emit('generated');
          }
        }
        if (data.type === 'generated' && !boardDelivered) emit('generated');
        if (data.type === 'error') emit('error', { message: data.message || 'O Guizz Studio original retornou um erro.' });
      });
    })();
  </script>
</body>
</html>
