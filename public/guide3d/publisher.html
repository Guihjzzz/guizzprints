<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Motor do Publicador Guizz</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#050608}</style>
</head>
<body>
  <iframe id="engine" title="Motor 3D do publicador" src="./engine/viewer.html?guizz=1&amp;publisher=1" allow="fullscreen"></iframe>
  <script type="module">
    import { convertFileToSchem } from './studio/converter/formatBridge.js?v=publisher-1';

    const engine = document.querySelector('#engine');
    const origin = location.origin;
    let engineReady = false;
    let pendingLoad = null;
    let activeUrl = '';
    let generationQueue = [];

    const emit = (type, payload = {}, transfer = []) => {
      if (window.parent === window) return;
      window.parent.postMessage({ guizzPublisher: 1, type, ...payload }, origin, transfer);
    };
    const send = (cmd, payload = {}) => engine.contentWindow?.postMessage({ bi: 1, cmd, ...payload }, origin);

    async function loadBuild(payload) {
      try {
        emit('status', { message: 'Convertendo o .mcstructure para o guia 3D…' });
        const file = new File([payload.buffer], payload.name || 'construcao.mcstructure', { type: 'application/octet-stream' });
        const result = await convertFileToSchem(file);
        const schemBuffer = await result.file.arrayBuffer();
        if (activeUrl) URL.revokeObjectURL(activeUrl);
        activeUrl = URL.createObjectURL(new Blob([schemBuffer], { type: 'application/octet-stream' }));
        emit('converted', { name: result.file.name, buffer: schemBuffer, blocks: result.blocks.length }, [schemBuffer]);
        emit('status', { message: 'Montando a construção no Guia 3D…' });
        send('loadSchem', { url: activeUrl, name: result.file.name, title: payload.title || result.file.name });
      } catch (error) {
        emit('error', { message: error instanceof Error ? error.message : 'Não foi possível converter o arquivo.' });
      }
    }

    function nextGeneration() {
      const next = generationQueue.shift();
      if (!next) return emit('generated');
      if (next === 'cover') {
        emit('status', { message: 'Gerando capa isométrica…' });
        send('thumbShot', { size: 1600, rot: 45, el: 35.264, zoom: 1, shadow: 0.28, ao: true });
      } else if (next === 'views') {
        emit('status', { message: 'Gerando oito vistas…' });
        send('shots', { n: 8, size: 1200 });
      } else if (next === 'spin') {
        emit('status', { message: 'Gravando vídeo giratório…' });
        send('spinVid', { size: 720, seconds: 7, shadow: 0.28 });
      }
    }

    addEventListener('message', (event) => {
      if (event.origin !== origin || event.source !== window.parent) return;
      const data = event.data;
      if (!data || data.guizzPublisher !== 1) return;
      if (data.type === 'load' && data.buffer) {
        if (!engineReady) pendingLoad = data;
        else void loadBuild(data);
      }
      if (data.type === 'generate' && engineReady) {
        generationQueue = ['cover', 'views', 'spin'];
        nextGeneration();
      }
    });

    addEventListener('message', (event) => {
      if (event.origin !== origin || event.source !== engine.contentWindow) return;
      const data = event.data;
      if (!data || data.bi !== 1) return;
      if (data.cmd === 'ready') {
        engineReady = true;
        send('auth', { member: true });
        send('gate', { on: false });
        send('bg', { mode: 'dark' });
        send('setGrid', { hidden: true });
        emit('ready');
        if (pendingLoad) {
          const payload = pendingLoad;
          pendingLoad = null;
          void loadBuild(payload);
        }
      }
      if (data.cmd === 'buildLoaded' && data.painted) {
        emit('loaded', { blocks: Number(data.blocks || 0), steps: Number(data.steps || 0), dims: data.dims || null });
        send('rgoto', { n: Number(data.steps || 0) });
        send('fitBuild', { rot: 45, elevation: 28 });
      }
      if (data.cmd === 'buildFailed') emit('error', { message: data.error || 'O Guia 3D não conseguiu abrir a construção.' });
      if (data.cmd === 'thumbShotDone') {
        if (data.err || !data.url) emit('error', { message: data.err || 'Falha ao gerar a capa.' });
        else emit('cover', { url: data.url });
        nextGeneration();
      }
      if (data.cmd === 'shotsDone') {
        emit('views', { shots: Array.isArray(data.shots) ? data.shots : [] });
        nextGeneration();
      }
      if (data.cmd === 'spinVidDone') {
        if (data.err || !data.buf) emit('error', { message: data.err || 'Falha ao gerar o vídeo.' });
        else emit('spin', { buffer: data.buf, mime: data.mime || 'video/webm' }, [data.buf]);
        nextGeneration();
      }
    });
  </script>
</body>
</html>
