<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Motor do Publicador Guizz</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#050608}</style>
</head>
<body>
  <iframe id="engine" title="Motor 3D do publicador" src="./engine/viewer.html?guizz=1&amp;publisher=1" allow="fullscreen"></iframe>
  <script type="module">
    import { convertWithOriginalEngine } from './original-converter-client.js?v=original-1';

    const engine = document.querySelector('#engine');
    const origin = location.origin;
    let engineReady = false;
    let pendingLoad = null;
    let activeUrl = '';
    let generationQueue = [];
    let activeGeneration = '';
    let warmupTimer = 0;
    let readyRetryTimers = [];

    const emit = (type, payload = {}, transfer = []) => {
      if (window.parent === window) return;
      window.parent.postMessage({ guizzPublisher: 1, type, ...payload }, origin, transfer);
    };
    const send = (cmd, payload = {}) => engine.contentWindow?.postMessage({ bi: 1, cmd, ...payload }, origin);

    // The engine can become ready before the React shell has mounted its
    // message listener.  Announce readiness a few times while the iframe is
    // idle so a real upload can never remain in "Preparando" because of that
    // startup race.
    function announceReady() {
      readyRetryTimers.forEach((timer) => window.clearTimeout(timer));
      readyRetryTimers = [];
      emit('ready');
      [180, 700, 1800].forEach((delay) => {
        readyRetryTimers.push(window.setTimeout(() => {
          if (engineReady) emit('ready');
        }, delay));
      });
    }

    async function loadBuild(payload) {
      try {
        emit('status', { message: 'Iniciando o conversor original para o Guia 3D…' });
        const file = new File([payload.buffer], payload.name || 'construcao.mcstructure', { type: 'application/octet-stream' });
        const converted = await convertWithOriginalEngine(file, (message) => emit('status', { message: `Guia 3D: ${message}` }));
        const schemBuffer = await converted.arrayBuffer();
        if (activeUrl) URL.revokeObjectURL(activeUrl);
        activeUrl = URL.createObjectURL(new Blob([schemBuffer], { type: 'application/octet-stream' }));
        emit('converted', { name: converted.name, buffer: schemBuffer }, [schemBuffer]);
        emit('status', { message: 'Montando a construção no Guia 3D…' });
        send('loadSchem', { url: activeUrl, name: converted.name, title: payload.title || converted.name });
      } catch (error) {
        emit('error', { message: error instanceof Error ? error.message : 'Não foi possível converter o arquivo.' });
      }
    }

    const dataUrlToBuffer = async (url) => {
      const response = await fetch(url);
      if (!response.ok) throw new Error('Não foi possível preparar uma das vistas geradas.');
      return response.arrayBuffer();
    };

    const loadImage = (url) => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Uma imagem gerada não pôde ser lida.'));
      image.src = url;
    });

    const canvasBlob = (canvas) => new Promise((resolve, reject) => {
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('O navegador não conseguiu criar o PNG.')), 'image/png');
    });

    // The Guide creates the public four-view cover. Its layout matches the
    // current cover design while leaving Guizz Studio focused on the board.
    async function composeFourViewCover(shots) {
      if (!Array.isArray(shots) || shots.length !== 4) throw new Error('O Guia 3D não gerou as quatro vistas necessárias para a capa.');
      const images = await Promise.all(shots.map((shot) => loadImage(shot?.url)));
      const width = 1600;
      const height = 1600;
      const columns = 2;
      const rows = 2;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d', { alpha: false });
      if (!context) throw new Error('Canvas 2D indisponível.');

      context.fillStyle = '#f6f7f8';
      context.fillRect(0, 0, width, height);
      const cellWidth = width / columns;
      const cellHeight = height / rows;
      images.forEach((image, index) => {
        const column = index % columns;
        const row = Math.floor(index / columns);
        const x = column * cellWidth;
        const y = row * cellHeight;
        context.fillStyle = index % 2 ? '#ffffff' : '#eef2f7';
        context.fillRect(x, y, cellWidth, cellHeight);
        context.strokeStyle = '#d6dce6';
        context.lineWidth = 2;
        context.strokeRect(x + 1, y + 1, cellWidth - 2, cellHeight - 2);
        const padding = 20;
        const scale = Math.min((cellWidth - padding * 2) / image.width, (cellHeight - padding * 2) / image.height);
        const drawWidth = image.width * scale;
        const drawHeight = image.height * scale;
        context.drawImage(image, x + (cellWidth - drawWidth) / 2, y + (cellHeight - drawHeight) / 2, drawWidth, drawHeight);
      });
      context.fillStyle = 'rgba(37,99,235,.75)';
      context.font = '700 25px system-ui, sans-serif';
      context.textAlign = 'center';
      context.fillText('www.guizzprints.xyz', width / 2, height / 2 + 8);
      context.textAlign = 'start';
      return canvasBlob(canvas);
    }

    async function publishCover(shots) {
      const blob = await composeFourViewCover(shots);
      const buffer = await blob.arrayBuffer();
      emit('cover', { buffer, mime: 'image/png' }, [buffer]);
    }

    async function publishViews(shots) {
      if (!Array.isArray(shots) || shots.length !== 8) throw new Error('O Guia 3D não gerou as oito vistas necessárias.');
      for (let index = 0; index < shots.length; index += 1) {
        const buffer = await dataUrlToBuffer(shots[index]?.url || '');
        emit('view', { index, buffer, mime: 'image/png' }, [buffer]);
      }
    }

    function nextGeneration() {
      const next = generationQueue.shift();
      if (!next) {
        activeGeneration = '';
        return emit('generated');
      }
      activeGeneration = next;
      if (next === 'cover') {
        emit('status', { message: 'Gerando a capa com quatro vistas…' });
        send('shots', { n: 4, size: 1200 });
      } else if (next === 'views') {
        emit('status', { message: 'Gerando oito vistas…' });
        send('shots', { n: 8, size: 1200 });
      }
    }

    addEventListener('message', (event) => {
      if (event.origin !== origin || event.source !== window.parent) return;
      const data = event.data;
      if (!data || data.guizzPublisher !== 1) return;
      if (data.type === 'load' && data.buffer) {
        if (!engineReady) pendingLoad = data;
        else void loadBuild(data);
      }
      if (data.type === 'warmup' && engineReady) {
        window.clearTimeout(warmupTimer);
        emit('status', { message: 'Estabilizando o holograma no Guia 3D…' });
        warmupTimer = window.setTimeout(() => {
          send('relayout');
          send('fitBuild', { rot: 45, elevation: 28 });
          emit('warmed');
        }, 900);
      }
      if (data.type === 'generate' && engineReady) {
        // Keep the public cover and gallery in the same Guide 3D renderer.
        // Guizz Studio runs separately and makes only the full board.
        generationQueue = ['cover', 'views'];
        nextGeneration();
      }
    });

    addEventListener('message', (event) => {
      if (event.origin !== origin || event.source !== engine.contentWindow) return;
      const data = event.data;
      if (!data || data.bi !== 1) return;
      if (data.cmd === 'ready') {
        engineReady = true;
        send('auth', { member: true });
        send('gate', { on: false });
        send('bg', { mode: 'dark' });
        send('setGrid', { hidden: true });
        announceReady();
        if (pendingLoad) {
          const payload = pendingLoad;
          pendingLoad = null;
          void loadBuild(payload);
        }
      }
      if (data.cmd === 'buildLoaded' && data.painted) {
        emit('loaded', { blocks: Number(data.blocks || 0), steps: Number(data.steps || 0), dims: data.dims || null });
        send('rgoto', { n: Number(data.steps || 0) });
        send('fitBuild', { rot: 45, elevation: 28 });
      }
      if (data.cmd === 'buildFailed') emit('error', { message: data.error || 'O Guia 3D não conseguiu abrir a construção.' });
      if (data.cmd === 'shotsDone') {
        const task = activeGeneration;
        const publish = task === 'cover' ? publishCover(data.shots) : task === 'views' ? publishViews(data.shots) : Promise.reject(new Error('O Guia 3D recebeu uma captura fora da fila de geração.'));
        void publish
          .then(() => {
            activeGeneration = '';
            nextGeneration();
          })
          .catch((error) => emit('error', { message: error?.message || 'Falha ao gerar as oito vistas.' }));
      }
    });
  </script>
</body>
</html>
