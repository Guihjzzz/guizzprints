<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guia 3D Guizz</title>
  <style>
    html,body,#guide{width:100%;height:100%;margin:0;border:0;background:#050608}
    #guide{display:block}
    #state{position:fixed;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100% - 32px);padding:10px 14px;border:1px solid #263044;border-radius:9px;background:#111318e8;color:#e4e4e7;font:600 13px system-ui;pointer-events:none}
    #state.error{border-color:#3b82f6;color:#dbeafe}
  </style>
</head>
<body>
  <iframe id="guide" title="Guia 3D da construção" allow="fullscreen"></iframe>
  <output id="state">Carregando Guia 3D…</output>
  <script>
    (() => {
      const frame = document.querySelector('#guide');
      const state = document.querySelector('#state');
      const origin = location.origin;
      const parameters = new URLSearchParams(location.search);
      const requested = parameters.get('model') || '';
      const title = String(parameters.get('title') || 'Construção Guizzprints').slice(0, 100);

      let localSource = '';
      let releaseUrl = '';
      try {
        const localUrl = new URL(requested, origin);
        if (localUrl.origin === origin && localUrl.pathname.startsWith('/demo/')) localSource = localUrl.pathname + localUrl.search;
      } catch (_) {}
      try {
        const url = new URL(requested);
        if (url.protocol === 'https:' && url.hostname === 'github.com' && url.pathname.startsWith('/Guizzhjz/guizzprints-assets/releases/download/')) releaseUrl = url.toString();
      } catch (_) {}

      if (!localSource && !releaseUrl) {
        state.textContent = 'A construção 3D não está disponível.';
        state.classList.add('error');
        return;
      }

      const setState = (message, error = false) => {
        state.textContent = message;
        state.classList.toggle('error', error);
      };

      const sourceUrl = localSource || `/api/guide3d/source?url=${encodeURIComponent(releaseUrl)}`;
      const sourceName = (localSource || releaseUrl).split('/').pop().split('?')[0] || 'construcao.mcstructure';

      const send = async () => {
        try {
          setState('Baixando a construção publicada…');
          const response = await fetch(sourceUrl, { cache: 'no-store' });
          if (!response.ok) throw new Error('A construção publicada não pôde ser carregada.');
          const buffer = await response.arrayBuffer();
          if (!buffer.byteLength) throw new Error('A construção publicada está vazia.');
          setState('Abrindo a construção no Guia 3D…');
          frame.contentWindow?.postMessage({
            guizzPublisher: 1,
            type: 'load',
            name: sourceName,
            buffer,
            title,
          }, origin, [buffer]);
        } catch (error) {
          setState(error && error.message ? error.message : 'Não foi possível abrir a construção.', true);
        }
      };

      // The published preview and the generator share the same local engine.
      // No iframe reaches a separate application or asks a device for access.
      frame.src = `./publisher.html?publicPreview=1&session=${encodeURIComponent(String(Date.now()))}`;
      window.addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow || event.origin !== origin || event.data?.guizzPublisher !== 1) return;
        if (event.data.type === 'ready') void send();
        if (event.data.type === 'status' && event.data.message) setState(event.data.message);
        if (event.data.type === 'loaded') {
          setState('Construção carregada.');
          window.setTimeout(() => state.remove(), 900);
        }
        if (event.data.type === 'error') setState(event.data.message || 'Não foi possível abrir a construção.', true);
      });
    })();
  </script>
</body>
</html>
